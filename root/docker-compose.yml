services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  next:
    build:
      context: ../app/next
      dockerfile: ${DOCKERFILE_PATH:-docker/local/Dockerfile}
    working_dir: /app
    volumes:
      - ../app/next:/app
      - node_modules:/app/node_modules
    command: sh -c "npm ci && npx prisma generate --schema src/prisma/schema.prisma && npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
      - "5555:5555"
    env_file:
      - ../app/next/.env
    environment:
      # ファイル監視を安定させるためにポーリングを有効化
      WATCHPACK_POLLING: "true"
    depends_on:
      - db
      - mailpit
      - ollama

volumes:
  dbdata:
  node_modules:
  ollama-data:
