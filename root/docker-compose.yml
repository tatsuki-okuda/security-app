services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  next:
    build:
      context: ../app/next
      dockerfile: ${DOCKERFILE_PATH:-docker/local/Dockerfile}
    working_dir: /app
    volumes:
      - ../app/next:/app
      - node_modules:/app/node_modules
    command: sh -c "npm ci && npx prisma generate --schema src/prisma/schema.prisma && npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
      - "5555:5555"
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app
      # ファイル監視を安定させるためにポーリングを有効化
      WATCHPACK_POLLING: "true"
      # Auth.js 導入までの暫定バイパス
      AUTH_BYPASS: "true"
      # 配信設定（SMTP/Slack）
      APP_BASE_URL: "http://localhost:3000"
      SMTP_HOST: "mailpit"
      SMTP_PORT: "1025"
      SMTP_USER: ""
      SMTP_PASS: ""
      MAIL_FROM: "no-reply@example.com"
      SLACK_WEBHOOK_URL: ""
    depends_on:
      - db
      - mailpit

volumes:
  dbdata:
  node_modules:
